name: ShiftProof Production Promote

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Validated Vercel preview URL to promote'
        required: true
        type: string
      confirm:
        description: 'Type PROMOTE to continue'
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    if: inputs.confirm == 'PROMOTE'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    env:
      VERCEL_CLI_VERSION: 59.19.1
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'tblevins-1457s-projects' }}
      VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'shiftproof-one' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Vercel token
        shell: bash
        run: |
          test -n '${{ secrets.VERCEL_TOKEN }}' || (echo 'VERCEL_TOKEN repository secret is required.' && exit 2)
      - run: npm install
      - run: npm install --global vercel@${VERCEL_CLI_VERSION}
      - name: Link production project
        run: vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token='${{ secrets.VERCEL_TOKEN }}'
      - name: Smoke test exact preview before promotion
        env:
          BASE_URL: ${{ inputs.deployment_url }}
          SHIFTPROOF_SMOKE_EMAIL: ${{ secrets.SHIFTPROOF_SMOKE_EMAIL }}
          SHIFTPROOF_SMOKE_PASSWORD: ${{ secrets.SHIFTPROOF_SMOKE_PASSWORD }}
        run: npm run smoke
      - name: Release endpoint check
        env:
          BASE_URL: ${{ inputs.deployment_url }}
        run: npm run release:check
      - name: Promote validated artifact
        run: vercel promote '${{ inputs.deployment_url }}' --scope "$VERCEL_SCOPE" --token='${{ secrets.VERCEL_TOKEN }}'
