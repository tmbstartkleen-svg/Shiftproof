name: ShiftProof Preview Deploy

on:
  workflow_dispatch:
  pull_request:
    paths: ['cloud/**','.github/workflows/shiftproof-preview.yml']
  push:
    branches: ['preview/**']
    paths: ['cloud/**','.github/workflows/shiftproof-preview.yml']

permissions:
  contents: read

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    env:
      VERCEL_CLI_VERSION: 61.0.0
      VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'shiftproof' }}
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Initialize deployment report
        run: printf '{"version":"14.0.0","commit":"%s","previewUrl":null,"status":"started","project":"%s","scope":"token-default"}\n' "$GITHUB_SHA" "$VERCEL_PROJECT_NAME" > deployment-result.json
      - name: Install dependencies
        run: npm install
      - name: Structural preflight
        run: npm run preflight
      - name: Typecheck
        run: npm run typecheck
      - name: Permission matrix tests
        run: npm run test:permissions
      - name: Next.js build
        run: npm run build
      - name: Mark validation success
        run: printf '{"version":"14.0.0","commit":"%s","previewUrl":null,"status":"validated","project":"%s","scope":"token-default"}\n' "$GITHUB_SHA" "$VERCEL_PROJECT_NAME" > deployment-result.json
      - name: Install pinned Vercel CLI
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: npm install --global vercel@${VERCEL_CLI_VERSION}
      - name: Validate Vercel token
        id: tokencheck
        if: env.HAS_VERCEL_TOKEN == 'true'
        continue-on-error: true
        run: vercel whoami --token='${{ secrets.VERCEL_TOKEN }}'
      - name: Determine deploy readiness
        id: deploycheck
        env:
          TOKEN_CHECK_OUTCOME: ${{ steps.tokencheck.outcome }}
        run: |
          if [ "$HAS_VERCEL_TOKEN" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing VERCEL_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ "$TOKEN_CHECK_OUTCOME" != "success" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=VERCEL_TOKEN rejected by Vercel" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "reason=authorized" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure ShiftProof Vercel project exists
        if: steps.deploycheck.outputs.ready == 'true'
        run: |
          vercel project inspect "$VERCEL_PROJECT_NAME" --token='${{ secrets.VERCEL_TOKEN }}' >/dev/null 2>&1 || vercel project add "$VERCEL_PROJECT_NAME" --token='${{ secrets.VERCEL_TOKEN }}'
          vercel link --yes --project "$VERCEL_PROJECT_NAME" --token='${{ secrets.VERCEL_TOKEN }}'
      - name: Pull preview environment
        if: steps.deploycheck.outputs.ready == 'true'
        run: vercel pull --yes --environment=preview --token='${{ secrets.VERCEL_TOKEN }}'
      - name: Vercel prebuild
        if: steps.deploycheck.outputs.ready == 'true'
        run: vercel build --token='${{ secrets.VERCEL_TOKEN }}'
      - name: Deploy preview artifact
        if: steps.deploycheck.outputs.ready == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token='${{ secrets.VERCEL_TOKEN }}')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '{"version":"14.0.0","commit":"%s","previewUrl":"%s","status":"deployed","project":"%s","scope":"token-default"}\n' "$GITHUB_SHA" "$url" "$VERCEL_PROJECT_NAME" > deployment-result.json
      - name: Smoke test preview
        if: steps.deploycheck.outputs.ready == 'true'
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          SHIFTPROOF_SMOKE_EMAIL: ${{ secrets.SHIFTPROOF_SMOKE_EMAIL }}
          SHIFTPROOF_SMOKE_PASSWORD: ${{ secrets.SHIFTPROOF_SMOKE_PASSWORD }}
        run: npm run smoke
      - name: Release endpoint check
        if: steps.deploycheck.outputs.ready == 'true'
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run release:check
      - name: Recovery public check
        if: steps.deploycheck.outputs.ready == 'true'
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run recovery:check
      - name: Save no-deploy result
        if: steps.deploycheck.outputs.ready != 'true'
        run: printf '{"version":"14.0.0","commit":"%s","previewUrl":null,"status":"deploy-skipped","reason":"%s","scope":"token-default"}\n' "$GITHUB_SHA" '${{ steps.deploycheck.outputs.reason }}' > deployment-result.json
      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiftproof-v14-deployment-report
          path: cloud/deployment-result.json
          if-no-files-found: error
